version: '3.8'

services:
  attack-range-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: attack-range-api
    ports:
      - "4000:4000"
    volumes:
      # Mount config directory for persistence
      - ../config:/app/config
      # Mount ssh_keys directory for persistence
      - ../ssh_keys:/app/ssh_keys
      # Mount templates (read-only)
      - ../templates:/app/templates:ro
      # Mount AWS credentials (if using AWS)
      - ~/.aws:/root/.aws:ro
      # Mount Azure credentials (if using Azure)
      - ~/.azure:/root/.azure:ro
      # Mount GCP credentials (if using GCP)
      - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
      # Ludus API key (set LUDUS_API_KEY in your shell environment)
      - LUDUS_API_KEY=${LUDUS_API_KEY:-}
    restart: unless-stopped
    networks:
      - attack-range-network

networks:
  attack-range-network:
    driver: bridge
